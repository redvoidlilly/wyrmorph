<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wyrmorph Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="downloadPetdataBtn" style="position:fixed;top:8px;right:8px;background:#8B0000;color:#fff;z-index:9999">download petdata</button>
<button id="importPetdataBtn" style="position:fixed;top:40px;right:8px;background:#8B0000;color:#fff;z-index:9999">import petdata</button>
<input type="file" id="importPetdataInput" accept=".zip" hidden>
<div style="text-align:center"><button id="versBtn">mobile version</button></div>
<div id="tabBarEl"><button id="homeTabBtn">Home</button><button id="dropsTabBtn" disabled> Drops</button><button id="morphsTabBtn" disabled>Morphs</button></div>
<div id="homeTabEl">
<div style="margin:32px auto;max-width:320px;text-align:center">access code<br><input id="accessCodeInput" style="margin-top:8px;text-align:center"><br><button id="accessCodeBtn" style="margin-top:8px">Enter</button><div id="accessErrorEl" hidden style="margin-top:8px;background:#E53935;color:#fff;padding:2px 8px;border-radius:4px;font-size:12px">Invalid access code</div></div>
</div>
<div id="dropsTabEl" hidden>
<div style="display:flex;gap:16px;justify-content:center;text-align:left">
<div>UserID: <input id="dropUseridInput"><br>Username: <input id="dropUsernameInput"></div>
<div><input type="checkbox" id="dropStandardCheck"> standard: <select id="dropStandardSelect"><option value="iron">iron</option><option value="gold">gold</option><option value="prismatic">prismatic</option></select></div>
<div><input type="checkbox" id="dropFestivalsCheck"> festivals: <select id="dropFestivalsSelect"><option value="spooky">spooky</option><option value="gifted">gifted</option><option value="lovely">lovely</option><option value="reborn">reborn</option><option value="silly">silly</option></select></div>
<div><input type="checkbox" id="dropSeasonalCheck"> seasonal: <select id="dropSeasonalSelect"><option value="winter">winter</option><option value="spring">spring</option><option value="summer">summer</option><option value="fall">fall</option></select></div>
</div>
<div style="margin-top:8px;display:flex;justify-content:center;text-align:left">
<div><input type="checkbox" id="dropChancesCheck"> chances:<br><textarea id="dropChancesBox" rows="3" cols="40"></textarea></div>
</div>
<div style="margin-top:8px"><button id="dropRollBtn" style="background:#8B5CF6;color:#fff;font-weight:bold">ROLL!!!</button></div>
<div id="dropLootEl" style="margin-top:8px"></div>
<div style="margin-top:8px"><button id="dropPostBtn" style="background:#22C55E;color:#fff">lootpost</button></div>
<div id="dropPostOutEl" hidden><textarea id="dropPostCodeEl" rows="12" cols="80" readonly></textarea><br><button id="copyDropPostBtn">Copy BBCode</button><div id="dropPostPreviewEl" style="border:1px solid #ccc;padding:12px;margin:12px auto;max-width:700px;text-align:center;background:#fff"></div></div>
</div>
<div id="morphsTabEl">
<button id="generateBtn" style="background:#8B5CF6;color:#fff">Random</button>
<button id="newbornBtn" style="background:#22C55E;color:#fff">Newborn</button>
<button id="customBtn" style="background:#FACC15">custom</button>
<button id="morphBtn" style="background:#E53935;color:#fff">Morph</button>
<button id="downloadBtn">Download Image</button>
<div style="display:flex;gap:16px;justify-content:center;text-align:left">
<div>Traits:<br><textarea id="customInput" rows="5" cols="25"></textarea><br>UserID: <input id="useridInput"><br>Username: <input id="usernameInput"><br>Id: <input id="idInput"><br><button id="loadIdBtn">load id</button><span id="loadErrorEl" hidden style="margin-left:8px;background:#E53935;color:#fff;padding:2px 8px;border-radius:4px;font-size:12px">ID not found</span></div>
<div>Mutagems:<br><textarea id="itemInput" rows="5" cols="25"></textarea></div>
</div>
<div id="stageEl"></div>
<div><button id="birthpostBtn" style="background:#22C55E;color:#fff">birthpost</button><button id="morphpostBtn" style="background:#E53935;color:#fff">morphpost</button></div>
<div id="postOutEl" hidden><textarea id="postCodeEl" rows="12" cols="80" readonly></textarea><br><button id="copyPostBtn">Copy BBCode</button> <button id="saveDataBtn" style="background:#FACC15">save data</button><span id="savePopupEl" hidden style="margin-left:8px;background:#22C55E;color:#fff;padding:2px 8px;border-radius:4px;font-size:12px">Saved!</span><div id="postPreviewEl" style="border:1px solid #ccc;padding:12px;margin:12px auto;max-width:700px;text-align:center;background:#fff"></div></div>
</div>
<script src="vendor_jszip.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
