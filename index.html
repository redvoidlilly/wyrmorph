<body>
  <h1>Wyrmorph Tools</h1>
  <button id="rollButton" type="button">Roll traits</button>
  <p id="error" role="alert"></p>
  <div id="stage" aria-label="Layered creature preview"></div>
  <div id="traits"></div>

  <script type="module">
    import { rollTraits } from "./roll.js";
    import { hindLegFiles } from "./spriteHandlers/leg.js";
    import { spriteLayer } from "./spriteHandlers/layer.js";

    const stage = document.querySelector("#stage");
    const traitsList = document.querySelector("#traits");
    const error = document.querySelector("#error");

    function assetUrl(file) {
      const normalizedFile = file
        .replace(/^genes\/earhorns\//, "genes/earhorn/")
        .replace(/^genes\/eyes\//, "genes/eye/")
        .replace(/^genes\/marks\//, "genes/mark/");
      return `species/wyrm/${normalizedFile}`;
    }

    function traitFiles(rolled) {
      const sprites = [];
      const addFiles = trait => {
        for (const src of trait?.files ?? []) {
          sprites.push({ src, layer: spriteLayer(src) });
        }
      };

      for (const name of ["leg", "shell", "neck", "cheek", "nose", "eye", "earhorn", "eyebrow", "tail"]) {
        addFiles(rolled[name]);
      }

      if (rolled.leg.hindleg) {
        for (const src of hindLegFiles) {
          sprites.push({ src, layer: spriteLayer(src) });
        }
      }

      const activeParts = new Set([
        rolled.shell.name,
        rolled.neck.name,
        rolled.cheek.name,
        rolled.nose.name,
        rolled.eye.name,
        rolled.earhorn.name,
        "earhorns",
        rolled.eyebrow.name,
        rolled.leg.name,
        rolled.tail.name
      ]);
      activeParts.add("nose");
      if (rolled.nose.name === "whiskers") activeParts.add("whiskers");

      for (const src of rolled.primaryMark.files) {
        const filename = src.split("/").pop().toLowerCase();
        const traitName = filename.replace(/^primary_/, "").split("_")[0];
        if (activeParts.has(traitName)) {
          sprites.push({ src, layer: spriteLayer(src) });
        }
      }

      for (const src of rolled.secondaryMark.files) {
        const filename = src.split("/").pop().toLowerCase();
        const belongsToPart = [rolled.leg.name, rolled.neck.name, rolled.cheek.name, rolled.tail.name]
          .some(name => filename.startsWith(`secondary_${name}_`)
            || filename.startsWith(`secondary_l_${name}_`)
            || filename.startsWith(`secondary_r_${name}_`));
        const isHindLegMark = rolled.leg.hindleg
          && filename.startsWith("secondary_legs_")
          && filename.includes("_hind_");
        if (belongsToPart || isHindLegMark) {
          sprites.push({ src, layer: spriteLayer(src) });
        }
      }

      addFiles(rolled.tertiary);
      sprites.push({
        src: "genes/watermark.webp",
        layer: spriteLayer("genes/watermark.webp")
      });

      return [...new Map(sprites.map(sprite => [sprite.src, sprite])).values()]
        .sort((a, b) => a.layer - b.layer);
    }

    function showTraits(rolled) {
      traitsList.replaceChildren();
      for (const [name, trait] of Object.entries(rolled)) {
        const row = document.createElement("div");
        row.textContent = `${name}: ${trait.name}`;
        traitsList.append(row);
      }
    }

    function showSprites(sprites) {
      stage.replaceChildren();

      for (const sprite of sprites) {
        const image = document.createElement("img");
        image.src = assetUrl(sprite.src);
        image.alt = "";
        image.style.zIndex = sprite.layer;
        image.addEventListener("error", () => {
          error.textContent = `Could not load ${assetUrl(sprite.src)}`;
        });
        stage.append(image);
      }
    }

    document.querySelector("#rollButton").addEventListener("click", () => {
      error.textContent = "";
      const rolled = rollTraits();
      showTraits(rolled);
      showSprites(traitFiles(rolled));
    });
  </script>
</body>
